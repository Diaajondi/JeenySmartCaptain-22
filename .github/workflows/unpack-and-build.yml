
name: Build Jeeny Smart Captain APK

on:
  push:
    branches:
      - main
      - version-0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: |
          test -f "JeenySmartCaptain-Updated.zip"
          mkdir -p project
          unzip -o "JeenySmartCaptain-Updated.zip" -d project

          PROJECT_DIR=$(find project -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Android project directory not found"
            find project -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Fix Java and Kotlin compatibility
        run: |
          cat > "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.jeenysmartcaptain"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.jeenysmartcaptain"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/JeenySmartCaptain.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JeenySmartCaptain-APK
          path: JeenySmartCaptain.apk
          if-no-files-found: error
          
