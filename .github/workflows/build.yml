
name: Build Jeeny Smart Captain APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development-next

permissions:
  contents: read

jobs:
  build:
    name: Build Jeeny Smart Captain 0.3.5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify and Extract Source
        run: |
          test -f JeenySmartCaptain-0.3.5-source.zip
          unzip -q JeenySmartCaptain-0.3.5-source.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Build Debug APK
        working-directory: source
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JeenySmartCaptain-0.3.5
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
